name: Flame-front snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # contributions glow like embers; the snake is a blue premixed flame front
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#4cc9f0&color_dots=#161b22,#4a1d0c,#8a2e0c,#e2570f,#ffb703
            dist/snake-light.svg?palette=github-light&color_snake=#1d4ed8&color_dots=#ebedf0,#ffd8a8,#ffa94d,#f76707,#c2410c

      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
