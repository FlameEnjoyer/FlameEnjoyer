<svg xmlns="http://www.w3.org/2000/svg" width="480" height="220" viewBox="0 0 480 220" role="img" aria-labelledby="t">
  <title id="t">Rich-quench-lean chemical reactor network of an ammonia gas turbine combustor</title>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .flow { stroke-dasharray: 5 6; animation: flow 1s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -11; } }
    .glow { animation: glow 2.4s ease-in-out infinite; }
    @keyframes glow { 0%, 100% { fill-opacity: .1; } 50% { fill-opacity: .28; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#0e1a17"/></linearGradient>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M16 0H0V16" fill="none" stroke="#c9d1d9" stroke-opacity=".05"/></pattern>
    <clipPath id="c"><rect width="480" height="220" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="480" height="220" fill="url(#bg)"/>
    <rect width="480" height="220" fill="url(#grid)"/>
  </g>

  <rect x="14" y="14" width="260" height="24" rx="12" fill="#34d399" fill-opacity=".12" stroke="#34d399" stroke-opacity=".5"/>
  <text x="144" y="30" text-anchor="middle" class="mono" font-size="11.5" letter-spacing="1" fill="#a7f3d0">CANTERA CRN · RICH-QUENCH-LEAN</text>

  <!-- main flow path -->
  <path d="M14 128H350" stroke="#484f58" stroke-width="2"/>
  <path class="flow" d="M350 128H392" stroke="#34d399" stroke-width="2.4"/>
  <g fill="#8b949e">
    <path d="M86 123L95 128L86 133Z"/>
    <path d="M180 123L189 128L180 133Z"/>
    <path d="M258 123L267 128L258 133Z"/>
  </g>
  <path d="M392 122L402 128L392 134Z" fill="#34d399"/>

  <!-- rich PSR with recirculation -->
  <circle class="glow" cx="126" cy="128" r="30" fill="#ff6b1a" fill-opacity=".14" stroke="#ff6b1a" stroke-width="1.8"/>
  <path class="flow" d="M146 106C156 70 96 70 106 106" fill="none" stroke="#ff9a4d" stroke-opacity=".75" stroke-width="1.5"/>
  <path d="M107.4 96.2L106.3 106.9L99.8 98.4Z" fill="#ff9a4d"/>
  <text x="126" y="127" text-anchor="middle" class="sans" font-size="14" font-weight="700" fill="#ffd8c2">PSR</text>
  <text x="126" y="143" text-anchor="middle" class="mono" font-size="11" fill="#ffb187">φ &gt; 1</text>

  <!-- quench: PFR cells + secondary air -->
  <g fill="#fbbf24" fill-opacity=".12" stroke="#fbbf24" stroke-width="1.4">
    <rect x="190" y="118" width="17" height="20" rx="3"/><rect x="211" y="118" width="17" height="20" rx="3"/><rect x="232" y="118" width="17" height="20" rx="3"/>
  </g>
  <path class="flow" d="M219.5 56V106" stroke="#7dd3fc" stroke-width="1.8"/>
  <path d="M214.5 104L219.5 114L224.5 104Z" fill="#7dd3fc"/>
  <text x="228" y="64" class="mono" font-size="11" fill="#7dd3fc">quench air</text>

  <!-- lean PFR -->
  <g fill="#38bdf8" fill-opacity=".12" stroke="#38bdf8" stroke-width="1.4">
    <rect x="270" y="118" width="17" height="20" rx="3"/><rect x="291" y="118" width="17" height="20" rx="3"/><rect x="312" y="118" width="17" height="20" rx="3"/><rect x="333" y="118" width="17" height="20" rx="3"/>
  </g>
  <text x="310" y="108" text-anchor="middle" class="mono" font-size="11" fill="#7dd3fc">φ &lt; 1</text>

  <!-- flow tracers -->
  <g fill="#e6edf3">
    <circle r="2.5"><animateMotion dur="3.6s" repeatCount="indefinite" path="M14 128H400"/><animate attributeName="opacity" values="0;1;1;0" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle r="2.5"><animateMotion dur="3.6s" begin="1.2s" repeatCount="indefinite" path="M14 128H400"/><animate attributeName="opacity" values="0;1;1;0" dur="3.6s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle r="2.5"><animateMotion dur="3.6s" begin="2.4s" repeatCount="indefinite" path="M14 128H400"/><animate attributeName="opacity" values="0;1;1;0" dur="3.6s" begin="2.4s" repeatCount="indefinite"/></circle>
  </g>

  <g class="mono" font-size="11">
    <text x="16" y="116" fill="#8b949e">NH₃/H₂ + air</text>
    <text x="126" y="180" text-anchor="middle" fill="#ffb187">rich</text>
    <text x="219.5" y="180" text-anchor="middle" fill="#fde68a">quench</text>
    <text x="310" y="180" text-anchor="middle" fill="#7dd3fc">lean</text>
  </g>

  <!-- outputs -->
  <g fill="#34d399">
    <circle cx="411" cy="109" r="2.5"/><circle cx="411" cy="127" r="2.5"/><circle cx="411" cy="145" r="2.5"/>
  </g>
  <g class="mono" font-size="11" fill="#a7f3d0">
    <text x="418" y="113">NOx</text>
    <text x="418" y="131">N₂O</text>
    <text x="418" y="149">NH₃ slip</text>
  </g>

  <rect x=".5" y=".5" width="479" height="219" rx="16" fill="none" stroke="#30363d"/>
</svg>
