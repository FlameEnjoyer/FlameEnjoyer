<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="t d">
  <title id="t">Roby Pratama Sitepu</title>
  <desc id="d">Animated banner: a premixed flame on a burner with temperature contours and a colour bar, next to the line "I study flames, and teach machines to make them cleaner."</desc>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .flame { transform-box: fill-box; transform-origin: 50% 100%; }
    .outer { animation: flick 2.4s ease-in-out infinite; }
    .mid { animation: flick 1.8s ease-in-out -.6s infinite; }
    .core { animation: flick 1.2s ease-in-out -.3s infinite; }
    @keyframes flick {
      0%, 100% { transform: scale(1, 1) skewX(0deg); }
      25% { transform: scale(.96, 1.05) skewX(1.8deg); }
      50% { transform: scale(1.03, .96) skewX(-1.2deg); }
      75% { transform: scale(.98, 1.03) skewX(.8deg); }
    }
    .glow { animation: pulse 3s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: .7; } 50% { opacity: 1; } }
    .field { transform-origin: 935px 300px; animation: breathe 6s ease-in-out infinite; }
    @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }
    .crawl { stroke-dasharray: 3 7; animation: crawl 12s linear infinite; }
    @keyframes crawl { to { stroke-dashoffset: -200; } }
    .ember { opacity: 0; animation: rise 4.5s ease-out infinite; }
    .l { animation-name: riseL; }
    .r { animation-name: riseR; }
    @keyframes rise { 0% { transform: translate(0, 0); opacity: 0; } 12% { opacity: 1; } 100% { transform: translate(0, -190px); opacity: 0; } }
    @keyframes riseL { 0% { transform: translate(0, 0); opacity: 0; } 12% { opacity: 1; } 100% { transform: translate(-36px, -180px); opacity: 0; } }
    @keyframes riseR { 0% { transform: translate(0, 0); opacity: 0; } 12% { opacity: 1; } 100% { transform: translate(32px, -185px); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset=".6" stop-color="#11151d"/>
      <stop offset="1" stop-color="#241008"/>
    </linearGradient>
    <radialGradient id="glowG" cx="935" cy="215" r="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff7a18" stop-opacity=".4"/>
      <stop offset=".4" stop-color="#ff5500" stop-opacity=".12"/>
      <stop offset="1" stop-color="#ff5500" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fadeG" cx="935" cy="240" r="320" gradientUnits="userSpaceOnUse">
      <stop offset=".2" stop-color="#fff"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="fade" maskUnits="userSpaceOnUse" x="0" y="0" width="1200" height="360">
      <rect width="1200" height="360" fill="url(#fadeG)"/>
    </mask>
    <pattern id="mesh" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#c9d1d9" stroke-opacity=".08"/>
    </pattern>
    <linearGradient id="gOuter" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff4d00"/>
      <stop offset=".55" stop-color="#ff7a00" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ffb000" stop-opacity=".15"/>
    </linearGradient>
    <linearGradient id="gMid" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffa000"/>
      <stop offset=".6" stop-color="#ffd23f"/>
      <stop offset="1" stop-color="#fff4c2" stop-opacity=".4"/>
    </linearGradient>
    <linearGradient id="gCore" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2f5bff"/>
      <stop offset=".75" stop-color="#4cc9f0"/>
      <stop offset="1" stop-color="#bdf3ff"/>
    </linearGradient>
    <linearGradient id="inferno" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#000004"/>
      <stop offset=".2" stop-color="#420a68"/>
      <stop offset=".4" stop-color="#932667"/>
      <stop offset=".6" stop-color="#dd513a"/>
      <stop offset=".8" stop-color="#fca50a"/>
      <stop offset="1" stop-color="#fcffa4"/>
    </linearGradient>
    <linearGradient id="nameG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".55" stop-color="#ffe6cc"/>
      <stop offset="1" stop-color="#ffab66"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1c2128"/>
      <stop offset=".4" stop-color="#8b949e"/>
      <stop offset=".6" stop-color="#6e7681"/>
      <stop offset="1" stop-color="#1c2128"/>
    </linearGradient>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <clipPath id="card"><rect width="1200" height="360" rx="20"/></clipPath>
    <!-- flame envelope, reused (scaled about the burner lip) for the temperature contours -->
    <path id="env" d="M911 300C896 268 897 222 915 180C925 156 931 128 935 96C939 128 945 156 955 180C973 222 974 268 959 300Z" vector-effect="non-scaling-stroke"/>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="360" fill="url(#bg)"/>

    <!-- CFD-style temperature field -->
    <g mask="url(#fade)">
      <rect x="560" width="640" height="360" fill="url(#mesh)"/>
      <g class="field" stroke-width="1.4">
        <use href="#env" transform="translate(935 300) scale(3.6) translate(-935 -300)" fill="#721f81" fill-opacity=".08" stroke="#8c2981" stroke-opacity=".5" class="crawl"/>
        <use href="#env" transform="translate(935 300) scale(2.85) translate(-935 -300)" fill="#b73779" fill-opacity=".08" stroke="#b73779" stroke-opacity=".55" class="crawl"/>
        <use href="#env" transform="translate(935 300) scale(2.2) translate(-935 -300)" fill="#dd513a" fill-opacity=".09" stroke="#e45a31" stroke-opacity=".6"/>
        <use href="#env" transform="translate(935 300) scale(1.7) translate(-935 -300)" fill="#f37819" fill-opacity=".1" stroke="#f98e09" stroke-opacity=".6"/>
        <use href="#env" transform="translate(935 300) scale(1.3) translate(-935 -300)" fill="#fca50a" fill-opacity=".12" stroke="#fbc02d" stroke-opacity=".65"/>
      </g>
    </g>

    <rect class="glow" width="1200" height="360" fill="url(#glowG)"/>

    <!-- flame -->
    <use href="#env" fill="#ff6a00" opacity=".55" filter="url(#blur)"/>
    <path class="flame outer" d="M911 300C896 268 897 222 915 180C925 156 931 128 935 96C939 128 945 156 955 180C973 222 974 268 959 300Z" fill="url(#gOuter)"/>
    <path class="flame mid" d="M915 300C905 272 907 234 920 202C928 182 932 164 935 140C938 164 942 182 950 202C963 234 965 272 955 300Z" fill="url(#gMid)"/>
    <path class="flame core" d="M918 300C922 270 929 244 935 222C941 244 948 270 952 300Z" fill="url(#gCore)"/>

    <!-- burner -->
    <rect x="913" y="300" width="44" height="70" fill="url(#steel)"/>
    <rect x="907" y="296" width="56" height="9" rx="2" fill="url(#steel)"/>
    <rect x="909" y="330" width="52" height="16" rx="2" fill="#2d333b" stroke="#484f58"/>
    <g fill="#0d1117">
      <rect x="917" y="334" width="8" height="8" rx="1"/>
      <rect x="931" y="334" width="8" height="8" rx="1"/>
      <rect x="945" y="334" width="8" height="8" rx="1"/>
    </g>

    <!-- embers -->
    <g fill="#ffc15e">
      <circle class="ember" cx="930" cy="170" r="2.2"/>
      <circle class="ember l" cx="922" cy="190" r="1.6" style="animation-delay:-.9s"/>
      <circle class="ember r" cx="946" cy="185" r="2" style="animation-delay:-1.7s"/>
      <circle class="ember" cx="938" cy="150" r="1.4" style="animation-delay:-2.4s"/>
      <circle class="ember l" cx="928" cy="160" r="2.4" fill="#ff8a3d" style="animation-delay:-3.1s"/>
      <circle class="ember r" cx="941" cy="200" r="1.5" style="animation-delay:-3.8s"/>
      <circle class="ember r" cx="933" cy="130" r="1.8" fill="#ff8a3d" style="animation-delay:-1.2s"/>
      <circle class="ember l" cx="945" cy="140" r="1.3" style="animation-delay:-2.9s"/>
    </g>

    <!-- colour bar -->
    <g class="mono" font-size="13" fill="#8b949e">
      <text x="1150" y="58" text-anchor="middle">T [K]</text>
      <rect x="1144" y="70" width="12" height="220" rx="3" fill="url(#inferno)" stroke="#30363d"/>
      <path d="M1138 74h5M1138 180h5M1138 286h5" stroke="#6e7681"/>
      <text x="1133" y="78" text-anchor="end">2400</text>
      <text x="1133" y="184" text-anchor="end">1350</text>
      <text x="1133" y="290" text-anchor="end">300</text>
    </g>

    <!-- text -->
    <g class="sans">
      <text x="72" y="80" class="mono" font-size="15" letter-spacing="4" fill="#ff9a4d">HELLO, I'M</text>
      <text x="68" y="142" font-size="60" font-weight="800" letter-spacing="-1" fill="url(#nameG)">Roby Pratama Sitepu</text>
      <text x="72" y="184" font-size="23" fill="#e6edf3">I study flames, and teach machines to make them cleaner.</text>
      <text x="72" y="214" font-size="17" fill="#8b949e">Mechanical Engineering · Combustion &amp; Energy Research</text>
    </g>

    <!-- chips -->
    <g class="mono" font-size="14" letter-spacing="1.2" text-anchor="middle">
      <rect x="72" y="238" width="124" height="30" rx="15" fill="#ff6b1a" fill-opacity=".12" stroke="#ff6b1a" stroke-opacity=".55"/>
      <text x="134" y="258" fill="#ffb187">COMBUSTION</text>
      <rect x="206" y="238" width="57" height="30" rx="15" fill="#fbbf24" fill-opacity=".12" stroke="#fbbf24" stroke-opacity=".55"/>
      <text x="234.5" y="258" fill="#fde68a">CFD</text>
      <rect x="273" y="238" width="95" height="30" rx="15" fill="#38bdf8" fill-opacity=".12" stroke="#38bdf8" stroke-opacity=".55"/>
      <text x="320.5" y="258" fill="#bae6fd">AI / ML</text>
      <rect x="378" y="238" width="143" height="30" rx="15" fill="#a78bfa" fill-opacity=".12" stroke="#a78bfa" stroke-opacity=".55"/>
      <text x="449.5" y="258" fill="#ddd6fe">OPTIMIZATION</text>
      <rect x="531" y="238" width="86" height="30" rx="15" fill="#34d399" fill-opacity=".12" stroke="#34d399" stroke-opacity=".55"/>
      <text x="574" y="258" fill="#a7f3d0">ENERGY</text>
    </g>

    <text x="72" y="318" class="mono" font-size="15" fill="#6e7681">4 NH₃ + 3 O₂ → 2 N₂ + 6 H₂O<tspan dx="18" fill="#3fb950">// zero-carbon fire</tspan></text>
  </g>
  <rect x=".5" y=".5" width="1199" height="359" rx="20" fill="none" stroke="#30363d"/>
</svg>
